<!DOCTYPE html>
<html>
    <head>
        <title>LwkeyOld</title>
        <link rel = "stylesheet" href = "popup.css">




    </head>
    <body>

        <div class = "header">

            <h1>LwkeyOld</h1>
            <p>Making the web look like 2010</p>

        </div>

        <div class = "status">
            <span id = "status-text">Extension enabled</span>
        </div>

        <div class = "controls">

            <button id = "toggle-btn">Disable</button>
            <button id = "refresh-btn">Refresh Page</button>

        </div>


        <div class = "sites-section">

            <p class = "sites-header">Toggle sites:</p>

            <div class = "site-toggles">
                <label><input type = "checkbox" data-site = "twitter" checked> Twitter/X</label>
                <label><input type = "checkbox" data-site = "google" checked> Google</label>
                <label><input type = "checkbox" data-site = "gmail" checked> Gmail</label>
                <label><input type = "checkbox" data-site = "facebook" checked> Facebook</label>
                <label><input type = "checkbox" data-site = "youtube" checked> YouTube</label>
                <label><input type = "checkbox" data-site = "reddit" checked> Reddit</label>
                <label><input type = "checkbox" data-site = "instagram" checked> Instagram</label>
                <label><input type = "checkbox" data-site = "linkedin" checked> LinkedIn</label>
                <label><input type = "checkbox" data-site = "github" checked> GitHub</label>
            </div>

        </div>

        <div class = "footer">

            <p>Supports: Twitter/X, Google, Gmail, Facebook, YouTube, Reddit, Instagram, LinkedIn, GitHub</p>


            <p>v1 made with nostalgia</p>


        </div>

        <script src = "popup.js"></script>

        
    </body>
</html>
